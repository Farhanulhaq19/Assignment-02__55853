name: Multi OS Runners
on: [push]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Display operating system
        run: echo "Running on ${{ matrix.os }}"
        
      - name: Windows PowerShell
        if: matrix.os == 'windows-latest'
        run: $PSVersionTable
        
      - name: macOS Swift
        if: matrix.os == 'macos-latest'
        run: swift --version
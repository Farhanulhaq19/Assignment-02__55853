name: Manual Workflow
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Enter your name'
        required: true
        default: 'Farhan Ul Haq'
      greeting:
        description: 'Enter a greeting'
        required: true
        default: 'Hello'
      data:
        description: 'Enter extra information'
        required: true
        default: 'DevOps GitHub Actions'

jobs:
  manual:
    runs-on: ubuntu-latest
    steps:
      - name: Show greeting
        run: echo "${{ github.event.inputs.greeting }} ${{ github.event.inputs.name }}"
      - name: Show data
        run: echo "${{ github.event.inputs.data }}"

name: Manual Workflow
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Enter your name'
        required: true
        default: 'Farhan'
      greeting:
        description: 'Enter a greeting'
        required: true
        default: 'Hello'
      data:
        description: 'Enter extra information'
        required: true
        default: 'DevOps CLI'

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - name: Display inputs
        run: |
          echo "${{ github.event.inputs.greeting }}, ${{ github.event.inputs.name }}!"
          echo "extra data: ${{ github.event.inputs.data }}"

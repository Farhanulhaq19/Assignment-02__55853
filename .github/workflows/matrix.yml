name: Matrix Build
on: [push]

jobs:
  matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        version: [3.11, 3.12]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
      - name: Show version
        run: echo "Running on ${{ matrix.os }} with Python ${{ matrix.version }}"